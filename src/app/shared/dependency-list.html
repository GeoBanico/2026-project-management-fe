<section class="panel">
  <h2>{{ heading() }}</h2>
  @if (tasks().length) {
    <ul class="relationships">
      @for (task of tasks(); track task.id) {
        <li>
          <a [routerLink]="['/projects', projectId(), 'tasks', task.id]">{{ task.name }}</a
          ><app-status-badge [status]="task.status" />
          @if (removable()) {
            <button
              type="button"
              [disabled]="busy()"
              (click)="remove.emit(task)"
              [attr.aria-label]="'Remove dependency on ' + task.name"
            >
              Remove link
            </button>
          }
        </li>
      }
    </ul>
  } @else {
    <app-empty-state message="No linked tasks." />
  }
</section>
